services:
  api:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: lugarcito-api
    environment:
      - PORT=8080
      - ENVIRONMENT=production
      - DATABASE_PATH=/app/data/lugarcito.db
    volumes:
      - lugarcito_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      # API REST + WebSocket
      - "traefik.http.routers.lugarcito-api.rule=Host(`TU_DOMINIO`) && (PathPrefix(`/api`) || PathPrefix(`/ws`))"
      - "traefik.http.routers.lugarcito-api.entrypoints=websecure"
      - "traefik.http.routers.lugarcito-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.lugarcito-api.loadbalancer.server.port=8080"

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        # Vacío = URLs relativas (Traefik rutea /api/* y /ws al back en el mismo dominio)
        API_URL: ""
        WS_URL: ""
    container_name: lugarcito-front
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lugarcito-front.rule=Host(`TU_DOMINIO`)"
      - "traefik.http.routers.lugarcito-front.entrypoints=websecure"
      - "traefik.http.routers.lugarcito-front.tls.certresolver=letsencrypt"
      - "traefik.http.services.lugarcito-front.loadbalancer.server.port=3000"

volumes:
  lugarcito_data:
